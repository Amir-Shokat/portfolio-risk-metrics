[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk"
version = "1.3.0"
description = "Historical risk measures for a retail portfolio page: volatility, downside deviation against the risk-free rate, Sharpe, Sortino, drawdown and recovery, VaR and beta, with eligibility statuses and a versioned methodology contract."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Amirmahdi Shokatabadi"}]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
charts = ["matplotlib>=3.5"]
dev = ["pytest>=7"]

[project.scripts]
portfolio-risk = "portfolio_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portfolio_risk = ["methodology.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
